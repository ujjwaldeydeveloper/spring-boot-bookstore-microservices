name: Catalog Service CI

on:
  push:
    paths:
      - "catalog-service/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: catalog-service/pom.xml

      - name: Build and test
        run: ./mvnw verify
